name: Build EXE & APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'version.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Set versi build
        shell: bash
        run: |
          V="1.0.${{ github.run_number }}"
          echo "VER=$V" >> "$GITHUB_ENV"
          cd desktop
          # GITHUB_ENV baru terbaca di step berikutnya, jadi VER harus di-export langsung di sini
          export VER="$V"
          node -e "const p=require('./package.json');p.version=process.env.VER;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"
          node -e "const v=require('./package.json').version;if(!v){console.error('version kosong');process.exit(1)};console.log('package.json version =',v)"
      - name: Salin file web ke folder desktop
        shell: bash
        run: |
          mkdir -p desktop/app
          cp index.html chibi.js net.js game.js visual.js ui.js desktop/app/
          sed -i "s/__BUILD__/${{ github.run_number }}/g" desktop/app/index.html
      - name: Build & publish EXE (auto-update aktif)
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npx electron-builder --win portable --publish always

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build APK (Capacitor; memuat konten live + banner update)
        run: |
          mkdir www
          cp index.html chibi.js net.js game.js visual.js ui.js www/
          sed -i "s/__BUILD__/${{ github.run_number }}/g" www/index.html
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../KillerVsSurvivor.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: KillerVsSurvivor.apk }

  release_apk_and_version:
    needs: [exe, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - name: Unggah APK ke rilis versi ini (dibuat oleh job exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v1.0.${{ github.run_number }}" out/KillerVsSurvivor.apk --clobber --repo byhasstudio/killer-vs-survivor
      - name: Tulis version.json (dipakai banner update di dalam app)
        run: echo '{"build":"${{ github.run_number }}"}' > version.json
      - name: Commit version.json ke main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "chore: versi build ${{ github.run_number }} [skip ci]"
          git pull --rebase origin main
          git push
