name: Update version.json

# Menulis version.json (dipakai banner "versi baru tersedia" di app EXE/APK).
# Dipisah dari build EXE/APK supaya keduanya tidak saling bergantung.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'version.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-json
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Tulis & commit version.json
        run: |
          BUILD=$(git log -1 --format=%h -- . ':!version.json' ':!README.md' ':!.github')
          echo "{\"build\":\"$BUILD\"}" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "chore: versi build $BUILD [skip ci]"
          git pull --rebase origin main
          git push
