name: Build EXE & APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Salin file web ke folder desktop
        shell: bash
        run: |
          mkdir -p desktop/app
          cp index.html chibi.js net.js game.js ui.js desktop/app/
      - name: Build EXE (portable, 1 file)
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win portable --publish never
          mv dist/*.exe dist/KillerVsSurvivor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: desktop/dist/KillerVsSurvivor.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK (Capacitor, debug)
        run: |
          mkdir www
          cp index.html chibi.js net.js game.js ui.js www/
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../KillerVsSurvivor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: KillerVsSurvivor.apk

  release:
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish ke Releases (tag: latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Download EXE & APK
          body: |
            - **KillerVsSurvivor.exe** : Windows (portable, tanpa instal)
            - **KillerVsSurvivor.apk** : Android (izinkan instal dari sumber tidak dikenal)
          files: out/*
